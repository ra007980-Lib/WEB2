
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sowl Digital</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: Arial;
            background-color: white;
        }

        .titulo {
            background-color: #eaf2ff;
            padding: 12px;
            font-weight: bold;
            color: #172b50;
        }

        .conteudo {
            border: 1px solid #b8d1f5;
            padding: 25px;
        }

        .icone {
            font-size: 45px;
            border: 2px solid #ccc;
            border-radius: 50%;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            color: #315b9b;
        }

        .instagram {
            color: #d9468f;
        }

        .foto {
            width: 100%;
            max-width: 330px;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <div class="border rounded mb-4">

        <div class="titulo">
            Atividade 1: Bloco "Channel" (Sowl Digital)
        </div>

        <div class="conteudo">

            <div class="row align-items-center text-center">

                <div class="col-12 col-md-3">

                    <div class="icone">
                        <i class="bi bi-facebook"></i>
                    </div>

                    <div class="icone instagram">
                        <i class="bi bi-instagram"></i>
                    </div>

                </div>

                <div class="col-12 col-md-9">

                    <h3><b>Siga a sOwl e empodere-se</b></h3>

                    <p>
                        Acesse nossas redes sociais e fique por dentro de tudo.
                    </p>

                    <img src="imagens/sowl-redes.png" class="foto" alt="Pessoa usando celular">

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
